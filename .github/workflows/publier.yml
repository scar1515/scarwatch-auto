name: Publier

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = verifier sans publier / run = publier"
        default: "test"
        type: choice
        options:
          - test
          - run

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: pip install requests

      - name: Lancer le programme
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: python publier.py

      - name: Sauvegarder la liste des publications faites
        if: always()
        run: |
          git config user.name "scarwatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add published.json || true
          git diff --cached --quiet || (git commit -m "Mise a jour des publications" && git push)
